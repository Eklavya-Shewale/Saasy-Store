spring:
  application:
    name: saasy-store-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:saasy_store}}
    username: ${DB_USERNAME:saasy_store}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  error:
    include-binding-errors: never
    include-message: never
    include-stacktrace: never
